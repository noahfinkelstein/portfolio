<!--
  Source for the link-preview image at src/app/opengraph-image.png (1200x630).
  This is what shows up when someone pastes the site into Slack, iMessage, or
  a tweet. Edit the text below, open this file in a browser, screenshot the
  card at exactly 1200x630, and overwrite src/app/opengraph-image.png.
-->
<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff}
  #card{width:1200px;height:630px;background:#fff;color:#16161a;
        font-family:Newsreader,Georgia,serif;
        display:flex;flex-direction:column;justify-content:center;
        padding:0 96px;box-sizing:border-box;position:relative}
  h1{font-size:82px;font-weight:600;letter-spacing:-.015em;margin:0 0 14px}
  p.role{font-size:34px;color:#6e6e76;margin:0 0 44px}
  .rule{height:2px;background:#7a2233;width:132px;margin-bottom:44px}
  ul{list-style:none;margin:0;padding:0;display:flex;gap:42px;
     font-family:"IBM Plex Mono",monospace;font-size:21px;color:#6e6e76;letter-spacing:.01em}
  .dom{position:absolute;bottom:64px;right:96px;font-family:"IBM Plex Mono",monospace;
       font-size:21px;color:#7a2233}
</style></head><body>
<div id="card">
  <h1>Noah Finkelstein</h1>
  <p class="role">Mathematics–Computer Science and Physics at Brown University</p>
  <div class="rule"></div>
  <ul><li>Experience</li><li>Projects</li><li>Photos</li><li>Blog</li></ul>
  <div class="dom">noahfinkelstein.com</div>
</div></body></html>
