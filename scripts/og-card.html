<!--
  Source for the link-preview image at src/app/opengraph-image.png (1200x630):
  what shows up when someone pastes the site into Slack, iMessage or a tweet.

  It is set like the site's front page in the Paper theme (colours from the
  paper tokens in src/app/globals.css, words from src/content/home.ts): the
  name and two lines in STIX Two Text, the domain in JetBrains Mono, and the
  trefoil drawn as ink strokes on the right. Edit the text below, then run

      sh scripts/og-image.sh

  which renders this file with headless Chrome and overwrites the PNG. Or open
  it in a browser and screenshot the card at exactly 1200x630. The knot is
  drawn by the small script at the bottom, with the same curve, viewing angle
  and breaks at the crossings as the hero's static figure
  (src/components/hero/knot.ts and TorusKnotSvg.tsx). Keep
  src/app/opengraph-image.alt.txt in step with the words here.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  /* Paper theme: --bg, --fg, --fg-muted, --border, --scene-wire. */
  html, body { margin: 0; padding: 0; background: #fbfaf7; }
  #card {
    position: relative;
    width: 1200px; height: 630px; overflow: hidden;
    box-sizing: border-box;
    background: #fbfaf7;
    color: #1b1a17;
    padding: 0 96px;
    display: flex; flex-direction: column; justify-content: center;
    font-family: "STIX Two Text", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  .text { position: relative; z-index: 2; max-width: 660px; }
  h1 {
    font-weight: 500; font-size: 96px; line-height: 1;
    letter-spacing: -0.015em; margin: 0 0 32px;
  }
  .lede { font-size: 34px; line-height: 1.25; margin: 0 0 14px; color: #1b1a17; }
  .roles { font-size: 27px; line-height: 1.35; margin: 0; color: #5c5a54; }
  /* The domain sits on a hairline across the text measure, like a running foot. */
  .dom {
    position: absolute; z-index: 2; bottom: 48px; left: 96px; right: 96px;
    padding-top: 14px; border-top: 1px solid #e4e0d6;
    font-family: "JetBrains Mono", Menlo, monospace; font-size: 21px;
    color: #5c5a54; letter-spacing: 0;
  }
  /* The trefoil (see the script). */
  #knot { position: absolute; z-index: 1; right: 64px; top: 70px; width: 400px; height: 400px; }
</style>
</head>
<body>
<div id="card">
  <div class="text">
    <h1>Noah Finkelstein</h1>
    <p class="lede">Mathematics–computer science and physics at Brown University.</p>
    <p class="roles">Co-founder of CourseTrees. Machine learning research.</p>
  </div>
  <svg id="knot" aria-hidden="true"></svg>
  <div class="dom">noahfinkelstein.com</div>
</div>
<script>
  // The (2,3) torus knot, turned and tilted as in knot.ts, projected
  // orthographically and drawn as solid ink strokes. A sample is left out
  // where another part of the curve passes over it, nearer the viewer, so
  // the under-strand breaks at each crossing as in a printed knot diagram.
  (function () {
    var svg = document.getElementById("knot");
    var ns = "http://www.w3.org/2000/svg";
    var P = 2, Q = 3, R = 2, A = 0.9;          // KNOT_SHAPE
    var TILT = 1.2, TURN = Math.PI / 2, FILL = 0.86; // KNOT_VIEW
    var INK = 0.026, GAP_R = 0.095;            // KNOT_INK
    var STEPS = 720, GAP = GAP_R + INK, SAME = STEPS / 12;

    function viewPoint(t) {
      var r = R + A * Math.cos(Q * t);
      var x = r * Math.cos(P * t), y = A * Math.sin(Q * t), z = r * Math.sin(P * t);
      var x1 = x * Math.cos(TURN) + z * Math.sin(TURN);
      var z1 = -x * Math.sin(TURN) + z * Math.cos(TURN);
      return [x1, y * Math.cos(TILT) - z1 * Math.sin(TILT), y * Math.sin(TILT) + z1 * Math.cos(TILT)];
    }

    var pts = [];
    for (var i = 0; i < STEPS; i++) pts.push(viewPoint((i / STEPS) * Math.PI * 2));
    var hidden = pts.map(function (a, i) {
      return pts.some(function (b, j) {
        var apart = Math.abs(i - j);
        if (Math.min(apart, STEPS - apart) <= SAME) return false;
        return b[2] > a[2] && Math.hypot(b[0] - a[0], b[1] - a[1]) < GAP;
      });
    });

    var half = (R + A + GAP_R) / FILL;
    svg.setAttribute("viewBox", [-half, -half, 2 * half, 2 * half].join(" "));
    var g = document.createElementNS(ns, "g");
    g.setAttribute("fill", "none");
    g.setAttribute("stroke", "#1b1a17");
    g.setAttribute("stroke-width", String(2 * INK * 1.4));
    g.setAttribute("stroke-linecap", "round");
    g.setAttribute("stroke-linejoin", "round");
    svg.appendChild(g);

    function fmt(i) { return pts[i][0].toFixed(3) + "," + (-pts[i][1]).toFixed(3); }
    function line(run) {
      if (run.length < 2) return;
      var el = document.createElementNS(ns, "polyline");
      el.setAttribute("points", run.join(" "));
      g.appendChild(el);
    }
    var start = hidden.findIndex(function (h, i) { return h && !hidden[(i + 1) % STEPS]; });
    if (start === -1) {
      var all = pts.map(function (_, i) { return fmt(i); });
      all.push(fmt(0));
      line(all);
      return;
    }
    var run = [];
    for (var k = 1; k <= STEPS; k++) {
      var idx = (start + k) % STEPS;
      if (hidden[idx]) { line(run); run = []; } else run.push(fmt(idx));
    }
    line(run);
  })();
</script>
</body>
</html>
